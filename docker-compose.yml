name: prumo-backend

services:
  backend:
    build:
      context: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 7001
      # Postgres gerenciado pelo Coolify (recurso "PostgreSQL" no mesmo projeto):
      # use a URL interna que o Coolify fornece nas Variables da aplicação.
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?defina JWT_ACCESS_SECRET (min 32 chars)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?defina JWT_REFRESH_SECRET (min 32 chars)}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?defina WEBHOOK_SECRET (min 16 chars)}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-30}
      RESET_TTL_MINUTES: ${RESET_TTL_MINUTES:-30}
      APP_ENV: ${APP_ENV:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://your-domain.com}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 7001 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Sem "ports": no Coolify o proxy roteia pela porta exposta do container.
    # Descomente apenas para teste local direto (docker compose up):
    # ports:
    #   - "7001:7001"
